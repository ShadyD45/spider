version: '3.8'

networks:
  artifact-net:
    driver: bridge

x-spider: &spider
  image: localhost/spider:local

services:
  minio:
    image: docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio-origin
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - artifact-net

  central-tracker:
    <<: *spider
    container_name: central-tracker
    command: ["tracker", "--config=/etc/spider/spider.yaml", "--port=50051"]
    ports:
      - "50051:50051"
      - "9091:9090"
    volumes:
      - ./deploy/spider-compose.yaml:/etc/spider/spider.yaml:ro
      - tracker-data:/var/lib/spider
    depends_on:
      - redis
    networks:
      - artifact-net

  prometheus:
    image: docker.io/prom/prometheus:v3.13.2
    container_name: spider-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - artifact-net
    depends_on:
      - central-tracker

  grafana:
    image: docker.io/grafana/grafana:13.1.3
    container_name: spider-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/provisioning/dashboards/spider.json:/var/lib/grafana/dashboards/spider.json:ro
    ports:
      - "3000:3000"
    networks:
      - artifact-net
    depends_on:
      - prometheus

  redis:
    image: docker.io/redis:8.10.0-alpine
    container_name: spider-redis
    ports:
      - "6379:6379"
    networks:
      - artifact-net

  worker-1:
    <<: *spider
    container_name: worker-node-1
    command: ["artifactd", "--node-id=worker-1", "--advertise-addr=worker-1:50052", "--port=50052", "--http-addr=:9090", "--tracker=central-tracker:50051", "--rack=rack-1", "--zone=zone-a"]
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - ./tmp/origin:/bench/origin:ro
      - ./tmp/bench:/data/bench
      - worker-1-data:/var/lib/spider
    ports:
      - "50052:50052"
    networks:
      - artifact-net
    depends_on:
      - central-tracker
      - minio

  worker-2:
    <<: *spider
    container_name: worker-node-2
    command: ["artifactd", "--node-id=worker-2", "--advertise-addr=worker-2:50052", "--port=50052", "--http-addr=:9090", "--tracker=central-tracker:50051", "--rack=rack-1", "--zone=zone-a"]
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - ./tmp/origin:/bench/origin:ro
      - ./tmp/bench:/data/bench
      - worker-2-data:/var/lib/spider
    ports:
      - "50053:50052"
    networks:
      - artifact-net
    depends_on:
      - central-tracker
      - minio

  worker-3:
    <<: *spider
    container_name: worker-node-3
    command: ["artifactd", "--node-id=worker-3", "--advertise-addr=worker-3:50052", "--port=50052", "--http-addr=:9090", "--tracker=central-tracker:50051", "--rack=rack-2", "--zone=zone-b"]
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - ./tmp/origin:/bench/origin:ro
      - ./tmp/bench:/data/bench
      - worker-3-data:/var/lib/spider
    ports:
      - "50054:50052"
    networks:
      - artifact-net
    depends_on:
      - central-tracker
      - minio

volumes:
  tracker-data:
  prometheus-data:
  grafana-data:
  worker-1-data:
  worker-2-data:
  worker-3-data:

